name: patrimony
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.2+4

environment:
  sdk: ">=3.0.6 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts:
  flutter_modular: ^6.3.2
  flutter_triple: ^3.0.0
  sign_in_with_apple: ^6.0.0
  google_sign_in: ^6.2.1
  dartz: ^0.10.1
  asuka:
    git:
      url: https://github.com/Flutterando/asuka.git
      ref: 82e0b98497d19d42e974d8252b31d13fde8e4ffb
  flutter_slidable: ^3.0.1
  flutter_native_splash: ^2.3.9
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  flutter_rating_bar: ^4.0.1
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0
  mobile_scanner: ^5.2.1
  path:
  supabase_flutter: ^2.0.0
  currency_text_input_formatter: 2.1.14
  camera: ^0.11.0+2
  share_plus: ^10.0.0
  firebase_auth: ^5.2.0
  firebase_storage: ^12.2.0
  firebase_remote_config: ^5.1.0
  firebase_core: ^3.4.0
  firebase_performance: ^0.10.0+5
  firebase_analytics: ^11.3.0
  firebase_crashlytics: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/image/

vars:
  clean: flutter clean
  get: flutter pub get
  runner: flutter pub run build_runner
scripts:
  mobx_build: $runner build --delete-conflicting-outputs
  mobx_watch: $runner watch --delete-conflicting-outputs
  build-ios: flutter build ipa --obfuscate --split-debug-info=/Users/marlonsodre/Develop.nosync/Flutter.nosync/patrimony/ofuscate
  build-android: flutter build appbundle --obfuscate --split-debug-info=/Users/marlonsodre/Develop.nosync/Flutter.nosync/patrimony/ofuscate && firebase crashlytics:symbols:upload --app=1:1041526288855:android:06528cca421b9b70e31b92 /Users/marlonsodre/Develop.nosync/Flutter.nosync/patrimony/ofuscate
